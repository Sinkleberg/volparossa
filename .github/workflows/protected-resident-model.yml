name: Public resident model integration contracts

on:
  push:
    branches: [feature/protected-resident-model]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protected-resident-model-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  contracts:
    if: github.repository == 'VOLPAROSSA/volparossa' && github.ref == 'refs/heads/feature/protected-resident-model'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind source and unchanged package versions
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir resident-model-evidence
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib,subprocess,tomllib
          base='339294e0f31c7ebccf7bbffcd18819fefe84dfcc'
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          old=tomllib.loads(git('show',base+':Cargo.lock'))
          new=tomllib.loads(pathlib.Path('Cargo.lock').read_text())
          assert [(p['name'],p['version'],p.get('checksum')) for p in old['package']]==[(p['name'],p['version'],p.get('checksum')) for p in new['package']]
          names=git('diff','--name-only',base,'HEAD').splitlines()
          receipt=dict(version=1,source_commit=os.environ['GITHUB_SHA'],source_tree=git('rev-parse','HEAD^{tree}'),base=base,
            source_blobs={n:git('rev-parse','HEAD:'+n) for n in names},
            dependency_versions_unchanged=True,actual_model_execution=False,guest_boot=False,private_peer_admission=False)
          pathlib.Path('resident-model-evidence/source.json').write_text(json.dumps(receipt,sort_keys=True)+'\n')
          PY

      - name: Prepare pinned hosted compiler and Protobuf
        run: |
          rustup toolchain install 1.85.0 --profile minimal --no-self-update --component clippy --component rustfmt
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends protobuf-compiler=3.21.12-8.2ubuntu0.3
          test "$(protoc --version)" = 'libprotoc 3.21.12'

      - name: Capture formatter patch separately from committed source
        id: format
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --binary -- '*.rs' > resident-model-evidence/format.patch
          python3 -B - <<'PY'
          import hashlib,json,pathlib,subprocess
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert all(p.endswith('.rs') for p in changed)
          receipt=dict(version=1,formatter_changed_files={p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in changed},
                       tested_source_is_committed=not changed)
          pathlib.Path('resident-model-evidence/format.json').write_text(json.dumps(receipt,sort_keys=True)+'\n')
          PY

      - name: Compile both affected crates
        id: build
        run: |
          set -euo pipefail
          cargo fetch --locked
          cargo test --locked --offline -p volparossa-content -p volparossa --no-run 2>&1 | tee resident-model-evidence/build.log

      - name: Test grants TLS lifecycle and unchanged native supervision
        run: |
          set -euo pipefail
          run_group() {
            local label="$1" package="$2" filter="$3"
            cargo test --locked --offline -p "$package" "$filter" -- --list 2>&1 | tee "resident-model-evidence/$label-inventory.log"
            timeout --kill-after=5s 180s cargo test --locked --offline -p "$package" "$filter" 2>&1 | tee "resident-model-evidence/$label-test.log"
          }
          run_group grant volparossa-content provider::compute::resident_task::
          run_group guest volparossa compute::resident_guest::
          run_group resident volparossa compute::supervise::native_session::
          run_group local volparossa compute::private_serve::tests::
          python3 -B - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('resident-model-evidence'); groups={}; all_names=[]
          for label in ('grant','guest','resident','local'):
            names=re.findall(r'^(.+): test$',(root/(label+'-inventory.log')).read_text(),re.M)
            output=(root/(label+'-test.log')).read_text()
            assert names and len(names)==len(set(names))
            for name in names: assert len(re.findall(r'^test '+re.escape(name)+r' \.\.\. ok$',output,re.M))==1
            assert f'{len(names)} passed; 0 failed; 0 ignored;' in output
            groups[label]=len(names); all_names.extend(names)
          assert groups['guest']>=10 and groups['resident']==30
          assert len(all_names)==len(set(all_names))
          (root/'tests.json').write_text(json.dumps(dict(version=1,counts=groups,test_names=sorted(all_names),model_execution=False,guest_boot=False,private_peer_admission=False),sort_keys=True)+'\n')
          PY

      - name: Lint affected code
        if: always() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          cargo clippy --locked --offline -p volparossa-content -p volparossa --all-targets -- -D warnings 2>&1 | tee resident-model-evidence/clippy.log

      - name: Inert workload staging contracts
        if: always()
        run: |
          set -euo pipefail
          if test -f tests/integration/test-protected-resident-model-workload.py; then
            python3 -B tests/integration/test-protected-resident-model-workload.py 2>&1 | tee resident-model-evidence/workload.log
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        if: always()
        with:
          name: public-resident-model-contracts
          path: resident-model-evidence
          if-no-files-found: error
          retention-days: 14
