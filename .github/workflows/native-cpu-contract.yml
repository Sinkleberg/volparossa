name: Native CPU source contracts

on:
  push:
    branches:
      - feature/native-cpu-inference
      - feature/native-coding-output-constraint
    paths:
      - workers/volparossa-ml/native-cpu/**
      - workers/volparossa-ml/build_llama_cpu.py
      - workers/volparossa-ml/llama_cpu.py
      - .github/workflows/native-cpu-contract.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-cpu-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: Source-only ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, asan-ubsan]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NATIVE_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require disposable hosted runner and exact source
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          for tool in cmake c++ cc git readelf; do command -v "$tool"; done
      - name: Fetch the pinned upstream source only
        run: |
          set -euo pipefail
          mkdir -p build/native-contract
          git init build/native-contract/llama
          git -C build/native-contract/llama remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C build/native-contract/llama fetch --depth=1 origin 7fe450e19305b828c199d602c23a8337aaa1f03b
          git -C build/native-contract/llama checkout --detach 7fe450e19305b828c199d602c23a8337aaa1f03b
          test "$(git -C build/native-contract/llama rev-parse HEAD)" = 7fe450e19305b828c199d602c23a8337aaa1f03b
      - name: Compile and run bounded native and upstream checks without models
        run: |
          set -euo pipefail
          flags=()
          if test "$NATIVE_MODE" = asan-ubsan; then flags+=(--sanitize); fi
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            python3 -B workers/volparossa-ml/build_llama_cpu.py \
              --source "$PWD/build/native-contract/llama" \
              --output "$PWD/build/native-contract/output" --execute --checks "${flags[@]}"
      - name: Retain original source-only reports and logs, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-source-${{ matrix.mode }}-${{ github.sha }}
          path: |
            build/native-contract/output/build.json
            build/native-contract/output/build.log
            build/native-contract/output/checks.log
          if-no-files-found: error
          retention-days: 14
